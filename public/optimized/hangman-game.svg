<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Hangman Game preview</title>
  <desc id="desc">A terminal-style Hangman game preview with word blanks and guessed letters.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#07111f"/>
      <stop offset=".55" stop-color="#111827"/>
      <stop offset="1" stop-color="#11261f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#bg)"/>
  <rect x="72" y="68" width="656" height="384" rx="28" fill="#020617" opacity=".78" stroke="#34d399" stroke-opacity=".35"/>
  <rect x="112" y="110" width="576" height="56" rx="16" fill="#111827"/>
  <circle cx="138" cy="138" r="7" fill="#ef4444"/><circle cx="162" cy="138" r="7" fill="#f59e0b"/><circle cx="186" cy="138" r="7" fill="#22c55e"/>
  <text x="224" y="145" fill="#86efac" font-family="JetBrains Mono, Consolas, monospace" font-size="20" font-weight="700">hangman.c</text>
  <g stroke="#67e8f9" stroke-width="9" stroke-linecap="round">
    <path d="M190 380h170M246 380V212M246 212h122M368 212v38"/>
  </g>
  <circle cx="368" cy="276" r="26" fill="none" stroke="#cbd5e1" stroke-width="8"/>
  <path d="M368 302v72M332 332h72M368 374l-34 42M368 374l34 42" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
  <text x="480" y="256" fill="#e2e8f0" font-family="JetBrains Mono, Consolas, monospace" font-size="42" font-weight="700">_ A _ G _ A _</text>
  <text x="480" y="314" fill="#94a3b8" font-family="JetBrains Mono, Consolas, monospace" font-size="20">guessed: C  E  R  T</text>
  <text x="480" y="360" fill="#86efac" font-family="JetBrains Mono, Consolas, monospace" font-size="20">language: C</text>
</svg>
